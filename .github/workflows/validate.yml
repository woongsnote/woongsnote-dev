name: Validate blog

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # One browser, one smoke script: no E2E runner or browser matrix.
      - run: npx playwright-core install --with-deps chromium
      # build already includes astro check and Pagefind; do not repeat them.
      - run: npm run validate
